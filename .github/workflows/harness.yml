name: Issue harness

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ["Harness CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Número da issue priorizada
        required: true
        type: string
      action:
        description: Entrada do workflow
        required: true
        type: choice
        options: [start, complete]
  pull_request:
    types: [closed]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  checks: read

concurrency:
  group: cal-diy-harness-controller
  cancel-in-progress: false

jobs:
  controller:
    name: Controlador
    if: |
      github.repository == 'victoria-ferrazzi/cal.diy' &&
      (
        (github.event_name == 'issues' && github.event.label.name == 'priorizado') ||
        (github.event_name == 'issue_comment' && github.event.sender.type == 'User' && github.event.issue.pull_request == null) ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run controller
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if command -v cursor-agent >/dev/null 2>&1; then
            echo "CURSOR_AGENT=cursor-agent" >> "$GITHUB_ENV"
          elif command -v agent >/dev/null 2>&1; then
            echo "CURSOR_AGENT=agent" >> "$GITHUB_ENV"
          else
            echo "Cursor CLI binary was not found on PATH" >&2
            exit 1
          fi
          node harness/controller.mjs

  verify:
    name: Versão publicada
    if: |
      github.repository == 'victoria-ferrazzi/cal.diy' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 1
      - uses: ./.github/actions/yarn-install
      - name: Verify the merge commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISHED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: node harness/controller.mjs
